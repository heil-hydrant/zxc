[package]
name = "zxc"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zxc-derive = { path = "../zxc-derive" }

# parseplz
body-plz = "0.0.55"
buffer-plz = "0.0.4"
decompression-plz = "0.0.32"
header-plz = "0.0.50"
http-plz = "0.0.12"
mime-plz = "0.0.2"
oneone-plz = { version = "0.0.19" }
protocol-traits-plz = "0.0.4"
two-plz = { git = "https://github.com/parseplz/two-plz" }

base64 = "0.23.1"
bytes = "*"
chrono = "0.4.45"
clap = { version = "4.6.6" , features = ["derive"] }
criterion = "*"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
ring = "0.17.14"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = { version = "2.0.21" }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-rustls = { version = "0.26.6"}
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
tracing = { version = "0.1.44"}
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
webpki-roots = "1.0.9"
wildcard = "0.3.0"
x509-parser = "0.18.1"
xattr = "1.6.1"
